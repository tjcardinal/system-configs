- name: Ensure /docker Exists
  become: yes
  ansible.builtin.file:
    path: "/docker"
    state: directory
    group: 1000
    owner: 1000

- name: Copy Files
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: "/docker/"

- name: Add TS_AUTHKEY to .env
  ansible.builtin.copy:
    content: "TS_AUTHKEY={{ ts_authkey }}"
    dest: "/docker/.env"

- name: Create and Start Services
  become: yes
  community.docker.docker_compose_v2:
    project_src: "/docker"
    pull: always
  register: output

- name: Show Results
  ansible.builtin.debug:
    var: output
